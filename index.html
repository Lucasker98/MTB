<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e0f1d"><title>לאטל ❤️ גיל 27</title>
<meta name="description" content="הפתעת יום הולדת קטנה לאטל ❤️">
<style>
:root{--red:#a30d1c;--shadow:0 24px 70px rgba(0,0,0,.28)}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#111;color:#fff}body{overflow:hidden}
.app{height:100dvh;position:relative;background:radial-gradient(circle at 20% 10%,rgba(169,16,34,.28),transparent 34%),linear-gradient(150deg,#0d203b 0%,#1f1116 45%,#07111f 100%)}
.page{position:absolute;inset:0;display:grid;place-items:center;padding:18px;opacity:0;transform:translateX(-8%);pointer-events:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto}.page.exit{opacity:0;transform:translateX(8%)}
.card{width:min(94vw,520px);height:min(79dvh,735px);border-radius:24px;overflow:hidden;position:relative;background:#111;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.18)}
.card img{width:100%;height:100%;object-fit:contain;background:#121212;display:block}
.controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6;padding:0 16px}
button{appearance:none;border:0;border-radius:999px;padding:15px 24px;font-size:18px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#c2142b,#8d0916);box-shadow:0 10px 30px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.25);min-width:min(88vw,330px)}
button:active{transform:scale(.98)}button:disabled{opacity:.55}
.intro{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.1),transparent 28%),linear-gradient(160deg,#0b1d38,#311017 55%,#090d16);transition:opacity .7s ease,visibility .7s ease}
.intro.hidden{opacity:0;visibility:hidden}.envelope{width:min(86vw,430px);padding:30px 24px;border-radius:28px;text-align:center;background:rgba(255,248,236,.97);color:#271515;box-shadow:var(--shadow);position:relative;border:2px solid rgba(244,199,108,.7)}
.envelope:before{content:"";position:absolute;inset:10px;border:1px dashed rgba(163,13,28,.28);border-radius:20px;pointer-events:none}
.intro h1{margin:0 0 8px;font-size:clamp(31px,9vw,48px);color:var(--red)}.intro p{margin:0 0 22px;font-size:18px;line-height:1.55}
.heart{font-size:42px;display:block;margin:6px 0 14px;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}.flake{position:absolute;top:-30px;color:#fff;opacity:.75;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110dvh) rotate(280deg)}}
.counter{position:absolute;top:18px;left:18px;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);padding:8px 12px;border-radius:999px;font-weight:700;z-index:8}
.final-note{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:min(86vw,420px);text-align:center;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);font-weight:700;z-index:7}
.status{font-size:13px;min-height:20px;margin-top:10px;color:#7b3a3a}@media(min-width:700px){.card{height:min(84dvh,820px)}.page{padding:28px}}
</style>
</head>
<body><div class="app"><div class="snow" id="snow"></div>
<section class="intro" id="intro"><div class="envelope"><span class="heart">❤️</span><h1>לאטל שלי</h1><p>יש לי משהו קטן בשבילך לכבוד גיל 27…</p><button id="openBtn" disabled>מכין את ההפתעה… ✨</button><div class="status" id="status"></div></div></section>
<section class="page active" id="page1"><div class="counter">1 / 2</div><div class="card"><img id="greeting" alt="ברכת יום הולדת לאטל"></div><div class="controls"><button id="nextBtn">יש עוד משהו… ❤️</button></div></section>
<section class="page" id="page2"><div class="counter">2 / 2</div><div class="card"><img id="surprise" alt="הפתעת טיסה לפראג"></div><div class="final-note">אורזים מזוודה ✈️ פראג מחכה לנו ❤️</div><div class="controls"><button id="againBtn">לראות שוב 🥹</button></div></section>
</div>
<script>
const intro=document.getElementById('intro'),p1=document.getElementById('page1'),p2=document.getElementById('page2'),openBtn=document.getElementById('openBtn'),status=document.getElementById('status');
async function loadPic(id,prefix){const parts=await Promise.all([0,1,2].map(i=>fetch('payload/'+prefix+'-0'+i+'.txt').then(r=>{if(!r.ok)throw Error();return r.text()})));document.getElementById(id).src='data:image/jpeg;base64,'+parts.join('').replace(/\s/g,'')}
Promise.all([loadPic('greeting','g'),loadPic('surprise','s')]).then(()=>{openBtn.disabled=false;openBtn.textContent='לפתוח את ההפתעה ✨'}).catch(()=>{status.textContent='לא הצלחתי לטעון. נסי לרענן ❤️';openBtn.textContent='לרענן';openBtn.disabled=false;openBtn.onclick=()=>location.reload()});
openBtn.addEventListener('click',()=>{if(document.getElementById('greeting').src)intro.classList.add('hidden')});
document.getElementById('nextBtn').addEventListener('click',()=>{p1.classList.remove('active');p1.classList.add('exit');setTimeout(()=>{p1.classList.remove('exit');p2.classList.add('active')},260)});
document.getElementById('againBtn').addEventListener('click',()=>{p2.classList.remove('active');setTimeout(()=>p1.classList.add('active'),260)});
const snow=document.getElementById('snow'),symbols=['❄','✦','•'];for(let i=0;i<34;i++){const s=document.createElement('span');s.className='flake';s.textContent=symbols[Math.floor(Math.random()*symbols.length)];s.style.left=Math.random()*100+'%';s.style.fontSize=8+Math.random()*16+'px';s.style.animationDuration=6+Math.random()*9+'s';s.style.animationDelay=-Math.random()*12+'s';s.style.opacity=.25+Math.random()*.55;snow.appendChild(s)}
let sx=null;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(sx===null||!intro.classList.contains('hidden'))return;const dx=e.changedTouches[0].clientX-sx;if(dx<-55&&p1.classList.contains('active'))document.getElementById('nextBtn').click();if(dx>55&&p2.classList.contains('active'))document.getElementById('againBtn').click();sx=null},{passive:true});
</script></body></html>
